displayName: Traefik Rate Limiter
type: middleware
import: github.com/OVINC-CN/TraefikRateLimiter
summary: URL-level fixed-window rate limiting middleware backed by Redis

testData:
  addHeaders: true
  ipStrategy:
    header: "X-Forwarded-For"
    depth: 0
    trustedHeaders: ["X-Real-IP"]
  redis:
    addr: "127.0.0.1:6379"
    password: ""
    db: 0
    keyPrefix: "rl:"
    timeout: "1s"
  default:
    requests: 100
    period: "1m"
  rules:
    - name: "login"
      path: "/api/v1/login"
      matchType: "exact"
      methods: ["POST"]
      requests: 5
      period: "1m"
    - name: "api-prefix"
      path: "/api/"
      matchType: "prefix"
      requests: 60
      period: "10s"
