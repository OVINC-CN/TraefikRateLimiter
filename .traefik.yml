displayName: Traefik Rate Limiter
type: middleware
import: github.com/OVINC-CN/TraefikRateLimiter
summary: URL-level rate limiting middleware with in-memory fixed-window counters.
  Supports per-path rules (exact or prefix), method filters, configurable IP
  strategy, time granularities of s/m/h/d and access-log friendly response
  headers.

testData:
  ipStrategy:
    header: "X-Forwarded-For"
    depth: 0
    trustedHeaders: ["X-Forwarded-For", "X-Real-IP"]
  default:
    requests: 100
    period: "1m"
  rules:
    - name: "login"
      path: "/api/v1/login"
      matchType: "exact"
      methods: ["POST"]
      requests: 5
      period: "1m"
    - path: "/api/"
      matchType: "prefix"
      requests: 60
      period: "1s"
